[Config Exp6_Mobility]
network = smarthome.MobilityNetwork
sim-time-limit = 60s
repeat = 5
seed-set = ${repetition}

**.arp.typename = "GlobalArp"
*.radioMedium.backgroundNoise.power = -110dBm
*.configurator.addStaticRoutes = true

# ---------------- Baseline static traffic (same as SmartHomeNetwork) ----------------
*.temp*.numApps = 1
*.temp*.app[0].typename = "UdpBasicApp"
*.temp*.app[0].destAddresses = "monitoringApp"
*.temp*.app[0].destPort = 5000
*.temp*.app[0].sendInterval = 10s
*.temp*.app[0].messageLength = 50B
*.temp*.app[0].packetName = "TempHumidityData"
*.temp*.app[0].startTime = uniform(0s,10s)

*.motion*.numApps = 1
*.motion*.app[0].typename = "UdpBasicApp"
*.motion*.app[0].destAddresses = "monitoringApp"
*.motion*.app[0].destPort = 5000
*.motion*.app[0].sendInterval = 10s
*.motion*.app[0].messageLength = 50B
*.motion*.app[0].packetName = "MotionData"
*.motion*.app[0].startTime = uniform(0s,10s)

*.smoke*.numApps = 1
*.smoke*.app[0].typename = "UdpBasicApp"
*.smoke*.app[0].destAddresses = "monitoringApp"
*.smoke*.app[0].destPort = 5000
*.smoke*.app[0].sendInterval = exponential(20s)
*.smoke*.app[0].messageLength = 50B
*.smoke*.app[0].packetName = "SmokeAlarmEvent"
*.smoke*.app[0].startTime = uniform(0s,5s)

*.light*.numApps = 1
*.light*.app[0].typename = "UdpSink"
*.light*.app[0].localPort = 5001
*.hvac1.numApps = 1
*.hvac1.app[0].typename = "UdpSink"
*.hvac1.app[0].localPort = 5001
*.alarm1.numApps = 1
*.alarm1.app[0].typename = "UdpSink"
*.alarm1.app[0].localPort = 5001

*.monitoringApp.numApps = 2
*.monitoringApp.app[0].typename = "UdpSink"
*.monitoringApp.app[0].localPort = 5000
*.monitoringApp.app[1].typename = "UdpBasicApp"
*.monitoringApp.app[1].destAddresses = "light1 light2 hvac1 alarm1"
*.monitoringApp.app[1].destPort = 5001
*.monitoringApp.app[1].sendInterval = 30s
*.monitoringApp.app[1].messageLength = 20B
*.monitoringApp.app[1].packetName = "ControlCommand"
*.monitoringApp.app[1].startTime = 1s

# ---------------- BONUS: Mobile wearable (panic-button / fall detector) ----------------
*.wearable1.numApps = 1
*.wearable1.app[0].typename = "UdpBasicApp"
*.wearable1.app[0].destAddresses = "monitoringApp"
*.wearable1.app[0].destPort = 5000
*.wearable1.app[0].sendInterval = 5s
*.wearable1.app[0].messageLength = 50B
*.wearable1.app[0].packetName = "WearableStatus"
*.wearable1.app[0].startTime = uniform(0s,5s)

*.wearable1.mobility.typename = "RandomWaypointMobility"
*.wearable1.mobility.speed = ${speed=0, 0.5, 1, 1.5, 2}mps
*.wearable1.mobility.waitTime = 2s
*.wearable1.mobility.constraintAreaMinX = 0m
*.wearable1.mobility.constraintAreaMinY = 0m
*.wearable1.mobility.constraintAreaMinZ = 0m
*.wearable1.mobility.constraintAreaMaxX = 32m
*.wearable1.mobility.constraintAreaMaxY = 20m
*.wearable1.mobility.constraintAreaMaxZ = 0m
*.wearable1.mobility.initialX = 10m
*.wearable1.mobility.initialY = 5m

# ---------------- Visualization ----------------
*.visualizer.*.numDataLinkVisualizers = 1
*.visualizer.*.dataLinkVisualizer[0].displayLinks = true
*.visualizer.*.numMobilityVisualizers = 1
*.visualizer.*.mobilityVisualizer[0].displayMobility = true

# ---------------- Statistics recording ----------------
**.vector-recording = false
**.scalar-recording = true
**.energyStorage.residualEnergyCapacity.result-recording-modes = +last
