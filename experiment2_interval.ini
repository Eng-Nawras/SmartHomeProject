[Config Exp2_Interval]
network = smarthome.ScalabilityNetwork
sim-time-limit = 600s
repeat = 5
seed-set = ${repetition}

**.arp.typename = "GlobalArp"
*.radioMedium.backgroundNoise.power = -110dBm
*.configurator.addStaticRoutes = true

*.numNodes = 12

*.node[*].numApps = 1
*.node[*].app[0].typename = "UdpBasicApp"
*.node[*].app[0].destAddresses = "monitoringApp"
*.node[*].app[0].destPort = 5000
*.node[*].app[0].sendInterval = ${T = 1s, 5s, 10s, 30s, 60s}
*.node[*].app[0].messageLength = 50B
*.node[*].app[0].packetName = "SensorData"
*.node[*].app[0].startTime = uniform(0s, ${T})

*.monitoringApp.numApps = 1
*.monitoringApp.app[0].typename = "UdpSink"
*.monitoringApp.app[0].localPort = 5000

**.vector-recording = false
**.scalar-recording = true
**.energyStorage.residualEnergyCapacity.result-recording-modes = +last
