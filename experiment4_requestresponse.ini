[Config Exp4_RequestResponse]
network = smarthome.SmartHomeNetwork
sim-time-limit = 300s
repeat = 5
seed-set = ${repetition}

**.arp.typename = "GlobalArp"
*.radioMedium.backgroundNoise.power = -110dBm
*.configurator.addStaticRoutes = true

# ---------------- Sensors act as request/response servers ----------------
*.temp*.numApps = 1
*.temp*.app[0].typename = "UdpEchoApp"
*.temp*.app[0].localPort = 5000

*.motion*.numApps = 1
*.motion*.app[0].typename = "UdpEchoApp"
*.motion*.app[0].localPort = 5000

# ---------------- Monitoring app polls each sensor individually ----------------
*.monitoringApp.numApps = 6
*.monitoringApp.app[*].typename = "UdpBasicApp"
*.monitoringApp.app[*].destPort = 5000
*.monitoringApp.app[*].sendInterval = ${I = 1s, 5s, 10s, 30s}
*.monitoringApp.app[*].messageLength = 10B
*.monitoringApp.app[*].packetName = "PollRequest"
*.monitoringApp.app[*].startTime = uniform(0s, ${I})
*.monitoringApp.app[0].destAddresses = "temp1"
*.monitoringApp.app[1].destAddresses = "temp2"
*.monitoringApp.app[2].destAddresses = "temp3"
*.monitoringApp.app[3].destAddresses = "motion1"
*.monitoringApp.app[4].destAddresses = "motion2"
*.monitoringApp.app[5].destAddresses = "motion3"

**.vector-recording = false
**.scalar-recording = true
