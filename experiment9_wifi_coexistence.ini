[General]
network = smarthome.WifiCoexistenceNetwork
sim-time-limit = 60s
repeat = 5
seed-set = ${repetition}

# ============================================================
# Shared dimensional wireless medium
# ============================================================

*.radioMedium.analogModel.typename = "DimensionalAnalogModel"
*.radioMedium.backgroundNoise.typename = "IsotropicDimensionalBackgroundNoise"
*.radioMedium.backgroundNoise.powerSpectralDensity = -113dBmWpMHz

# ============================================================
# IEEE 802.15.4 radios
# ============================================================

*.temp*.wlan[*].radio.typename = "Ieee802154NarrowbandDimensionalRadio"
*.motion*.wlan[*].radio.typename = "Ieee802154NarrowbandDimensionalRadio"
*.smoke*.wlan[*].radio.typename = "Ieee802154NarrowbandDimensionalRadio"
*.light*.wlan[*].radio.typename = "Ieee802154NarrowbandDimensionalRadio"
*.hvac1.wlan[*].radio.typename = "Ieee802154NarrowbandDimensionalRadio"
*.alarm1.wlan[*].radio.typename = "Ieee802154NarrowbandDimensionalRadio"
*.gateway.wlan[*].radio.typename = "Ieee802154NarrowbandDimensionalRadio"

# 802.15.4 spectrum
*.temp*.wlan[*].radio.transmitter.frequencyGains = "left c-5MHz -40dB linear c-2MHz -20dB linear c-1MHz 0dB either c+1MHz 0dB linear c+2MHz -20dB linear c+5MHz -40dB right"
*.motion*.wlan[*].radio.transmitter.frequencyGains = "left c-5MHz -40dB linear c-2MHz -20dB linear c-1MHz 0dB either c+1MHz 0dB linear c+2MHz -20dB linear c+5MHz -40dB right"
*.smoke*.wlan[*].radio.transmitter.frequencyGains = "left c-5MHz -40dB linear c-2MHz -20dB linear c-1MHz 0dB either c+1MHz 0dB linear c+2MHz -20dB linear c+5MHz -40dB right"
*.light*.wlan[*].radio.transmitter.frequencyGains = "left c-5MHz -40dB linear c-2MHz -20dB linear c-1MHz 0dB either c+1MHz 0dB linear c+2MHz -20dB linear c+5MHz -40dB right"
*.hvac1.wlan[*].radio.transmitter.frequencyGains = "left c-5MHz -40dB linear c-2MHz -20dB linear c-1MHz 0dB either c+1MHz 0dB linear c+2MHz -20dB linear c+5MHz -40dB right"
*.alarm1.wlan[*].radio.transmitter.frequencyGains = "left c-5MHz -40dB linear c-2MHz -20dB linear c-1MHz 0dB either c+1MHz 0dB linear c+2MHz -20dB linear c+5MHz -40dB right"
*.gateway.wlan[*].radio.transmitter.frequencyGains = "left c-5MHz -40dB linear c-2MHz -20dB linear c-1MHz 0dB either c+1MHz 0dB linear c+2MHz -20dB linear c+5MHz -40dB right"

# ============================================================
# IEEE 802.11 radios
# ============================================================

*.wifiHost*.wlan[*].radio.typename = "Ieee80211DimensionalRadio"
*.wifiHost*.wlan[*].radio.channelNumber = 8

*.wifiHost*.wlan[*].radio.transmitter.frequencyGains = "left c-b*1.5 -40dB linear c-b -28dB linear c-b*0.5-1MHz -20dB linear c-b*0.5+1MHz 0dB linear c+b*0.5-1MHz 0dB linear c+b*0.5+1MHz -20dB linear c+b -28dB linear c+b*1.5 -40dB right"

*.wifiHost*.wlan[*].radio.receiver.snirThresholdMode = "mean"
*.wifiHost*.wlan[*].radio.receiver.errorModel.snirMode = "mean"

# ============================================================
# Smart-home traffic
# ============================================================

*.temp*.numApps = 1
*.temp*.app[0].typename = "UdpBasicApp"
*.temp*.app[0].destAddresses = "monitoringApp"
*.temp*.app[0].destPort = 5000
*.temp*.app[0].sendInterval = 10s
*.temp*.app[0].messageLength = 50B
*.temp*.app[0].packetName = "TempHumidityData"
*.temp*.app[0].startTime = uniform(0s,10s)

*.motion*.numApps = 1
*.motion*.app[0].typename = "UdpBasicApp"
*.motion*.app[0].destAddresses = "monitoringApp"
*.motion*.app[0].destPort = 5000
*.motion*.app[0].sendInterval = 10s
*.motion*.app[0].messageLength = 50B
*.motion*.app[0].packetName = "MotionData"
*.motion*.app[0].startTime = uniform(0s,10s)

*.smoke*.numApps = 1
*.smoke*.app[0].typename = "UdpBasicApp"
*.smoke*.app[0].destAddresses = "monitoringApp"
*.smoke*.app[0].destPort = 5000
*.smoke*.app[0].sendInterval = exponential(20s)
*.smoke*.app[0].messageLength = 50B
*.smoke*.app[0].packetName = "SmokeAlarmEvent"
*.smoke*.app[0].startTime = uniform(0s,5s)

*.light*.numApps = 1
*.light*.app[0].typename = "UdpSink"
*.light*.app[0].localPort = 5001

*.light2.numApps = 1
*.hvac1.numApps = 1
*.hvac1.app[0].typename = "UdpSink"
*.hvac1.app[0].localPort = 5001

*.alarm1.numApps = 1
*.alarm1.app[0].typename = "UdpSink"
*.alarm1.app[0].localPort = 5001

*.monitoringApp.numApps = 2
*.monitoringApp.app[0].typename = "UdpSink"
*.monitoringApp.app[0].localPort = 5000

*.monitoringApp.app[1].typename = "UdpBasicApp"
*.monitoringApp.app[1].destAddresses = "light1 light2 hvac1 alarm1"
*.monitoringApp.app[1].destPort = 5001
*.monitoringApp.app[1].sendInterval = 30s
*.monitoringApp.app[1].messageLength = 20B
*.monitoringApp.app[1].packetName = "ControlCommand"
*.monitoringApp.app[1].startTime = 1s

# ============================================================
# Wi-Fi interference traffic
# ============================================================

*.wifiHost1.numApps = 1
*.wifiHost1.app[0].typename = "UdpBasicApp"
*.wifiHost1.app[0].destAddresses = "wifiHost2"
*.wifiHost1.app[0].destPort = 5002
*.wifiHost1.app[0].messageLength = 1000B
*.wifiHost1.app[0].packetName = "WiFiInterference"
*.wifiHost1.app[0].startTime = 0.2s

*.wifiHost2.numApps = 1
*.wifiHost2.app[0].typename = "UdpSink"
*.wifiHost2.app[0].localPort = 5002

# ============================================================
# Recording
# ============================================================

**.vector-recording = false
**.scalar-recording = true


# ============================================================
# Experiment 9 - Wi-Fi Coexistence
# ============================================================

[Config Exp9_NoWiFi]
*.wifiHost1.numApps = 0
*.wifiHost2.numApps = 0

[Config Exp9_Low]
*.wifiHost1.app[0].sendInterval = 100ms

[Config Exp9_Medium]
*.wifiHost1.app[0].sendInterval = 10ms

[Config Exp9_High]
*.wifiHost1.app[0].sendInterval = 1ms
